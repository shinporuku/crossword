<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Crossword</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script src="crossword.js" defer></script>
</head>

<body>
    <!-- <h1>クロスワード</h1> -->
    <div id="lang-row">
        <div id="lang-switcher">
            <span id="lang-jp">jp</span> /
            <span id="lang-kr">kr</span>
        </div>
        <div id="tap-msg">マスをタップして答えを入力してください。</div>
    </div>


    <div id="crossword"></div>
    <div id="current-clue"></div>
    <div id="keyboard"></div>
    <button id="check">答え合わせ</button>
    <h2 id="hint-title">ヒント</h2>
    <div id="hint-note">答えは全部英字です。</div>
    <div id="clues"></div>
</body>

</html>
